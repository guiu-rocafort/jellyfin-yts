<!DOCTYPE html>
<html lang="en">
<head>
    <title>YTS Torrents</title>
</head>
<body>
    <div id="YtsTorrentsBrowsePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2>YTS Torrents</h2>
                    <button is="emby-button" type="button" id="OpenSearchModalButton" class="raised button-submit block emby-button">
                        <span>Search</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <h3>Downloads</h3>
                    <div id="YtsDownloadsList"></div>
                </div>
            </div>
        </div>

        <!-- Search modal: hidden until "Search" is clicked. A hand-rolled overlay rather than any
             Jellyfin dialog helper, since this page's own script execution and DOM lifecycle already
             turned out to have several undocumented quirks in 12.1 (see the comment below on
             pageshow/pagehide) -- a self-contained modal avoids depending on internal APIs that may
             not behave the same way across versions. -->
        <div id="YtsSearchModalBackdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; padding: 1em;">
            <div id="YtsSearchModalBox" style="background: #101010; border-radius: 6px; padding: 1.5em; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 4px 24px rgba(0,0,0,0.5);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em;">
                    <h2 style="margin: 0;">Search YTS</h2>
                    <button is="emby-button" type="button" id="CloseSearchModalButton" class="raised emby-button" style="min-width: auto;">
                        <span>Close</span>
                    </button>
                </div>
                <form id="YtsTorrentsSearchForm">
                    <div style="margin-bottom: 16px;">
                        <input is="emby-input" type="text" id="YtsSearchQuery" label="Search YTS" placeholder="Movie title..." />
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Search</span>
                    </button>
                </form>

                <div class="verticalSection">
                    <h3>Results</h3>
                    <div id="YtsSearchResultsInfo"></div>
                    <div id="YtsSearchResults"></div>
                </div>
            </div>
        </div>
        <!-- This <script> MUST be a descendant of the div[data-role="page"] above, not a sibling after
             it: Jellyfin's viewContainer.js parseHtml() extracts only that div (via
             wrapper.querySelector('div[data-role="page"]')) when loading this page, so anything
             outside it -- including a sibling <script> -- is silently discarded and never runs. -->
        <style>
            .yts-loading-spinner {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 3px solid rgba(0, 180, 255, 0.2);
                border-top-color: #00b4ff;
                border-radius: 50%;
                animation: yts-spin 0.8s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }
            @keyframes yts-spin {
                to { transform: rotate(360deg); }
            }
            .yts-quality-badge {
                display: inline-block;
                padding: 2px 6px;
                border-radius: 3px;
                font-size: 0.75em;
                font-weight: 600;
                margin-right: 6px;
                white-space: nowrap;
            }
            .yts-quality-recommended {
                background-color: rgba(102, 187, 106, 0.3);
                color: #66bb6a;
            }
            .yts-quality-standard {
                background-color: rgba(0, 164, 220, 0.3);
                color: #00a4dc;
            }
            .yts-torrent-metadata {
                font-size: 0.85em;
                color: #b0b0b0;
                margin-top: 6px;
            }
            .yts-results-info {
                padding: 8px;
                border-radius: 4px;
                margin-bottom: 12px;
                font-size: 0.9em;
                color: #b0b0b0;
                background-color: rgba(0, 0, 0, 0.2);
            }
        </style>
        <script type="text/javascript">
        (function () {
            var pollHandle = null;

            function searchUrl(query) {
                return ApiClient.getUrl('Plugins/YtsTorrents/Search', { query: query });
            }

            function downloadsUrl() {
                return ApiClient.getUrl('Plugins/YtsTorrents/Downloads');
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function statusBadgeHtml(status) {
                var badgeClass = 'yts-badge ';
                var displayText = status;

                if (status === 'Downloaded') {
                    badgeClass += 'yts-badge-completed';
                    displayText = '✓ ' + status;
                } else if (status === 'Downloading') {
                    badgeClass += 'yts-badge-downloading';
                    displayText = '↓ ' + status;
                } else if (status === 'Failed') {
                    badgeClass += 'yts-badge-failed';
                    displayText = '✗ ' + status;
                }

                return '<span class="' + badgeClass + '">' + displayText + '</span>';
            }

            function renderResults(movies) {
                var container = document.querySelector('#YtsSearchResults');
                var infoContainer = document.querySelector('#YtsSearchResultsInfo');

                if (!movies || movies.length === 0) {
                    infoContainer.innerHTML = '';
                    container.innerHTML = '<p>No results found. Try a different search term.</p>';
                    return;
                }

                var totalTorrents = movies.reduce(function (sum, m) { return sum + (m.Torrents || []).length; }, 0);
                infoContainer.innerHTML = '<div class="yts-results-info">Found ' + movies.length + ' movies · ' + totalTorrents + ' torrents available</div>';

                var html = movies.map(function (movie) {
                    var sortedTorrents = (movie.Torrents || []).slice().sort(function (a, b) {
                        var aQuality = parseInt(a.Quality, 10) || 0;
                        var bQuality = parseInt(b.Quality, 10) || 0;
                        if (aQuality !== bQuality) return bQuality - aQuality;
                        return parseInt(b.Seeds, 10) - parseInt(a.Seeds, 10);
                    });

                    var rows = sortedTorrents.map(function (torrent) {
                        var qualityMatch = /(\d+)p/.exec(torrent.Quality);
                        var quality = qualityMatch ? parseInt(qualityMatch[1], 10) : 0;
                        var qualityBadge = quality >= 1080
                            ? '<span class="yts-quality-badge yts-quality-recommended">★ ' + escapeHtml(torrent.Quality) + ' - RECOMMENDED</span>'
                            : '<span class="yts-quality-badge yts-quality-standard">' + escapeHtml(torrent.Quality) + '</span>';

                        var actionCell = torrent.Downloaded
                            ? statusBadgeHtml('Downloaded')
                            : '<button is="emby-button" class="raised emby-button yts-download-btn" ' +
                              'data-movie-id="' + escapeHtml(movie.MovieId) + '" data-hash="' + escapeHtml(torrent.Hash) + '">' +
                              '<span>Download</span></button>';

                        var seedsColor = parseInt(torrent.Seeds, 10) > 100 ? '#66bb6a' : (parseInt(torrent.Seeds, 10) > 10 ? '#ffc107' : '#ff6b6b');
                        var healthBar = '<span style="color:' + seedsColor + ';">●</span> ' + escapeHtml(torrent.Seeds) + ' seeds';

                        return '<tr>' +
                            '<td>' + qualityBadge + '<div class="yts-torrent-metadata">' + escapeHtml(torrent.Type) + ' · ' + escapeHtml(torrent.Size) + ' · ' + healthBar + '</div></td>' +
                            '<td>' + actionCell + '</td>' +
                            '</tr>';
                    }).join('');

                    return '<div class="yts-movie">' +
                        '<h4>' + escapeHtml(movie.Title) + ' (' + escapeHtml(movie.Year) + ') &ndash; ' + escapeHtml(movie.Rating) + '/10</h4>' +
                        '<table class="detailTable"><thead><tr><th>Torrent</th><th></th></tr></thead>' +
                        '<tbody>' + rows + '</tbody></table>' +
                        '</div>';
                }).join('');

                container.innerHTML = html;

                container.querySelectorAll('.yts-download-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        startDownload(btn.getAttribute('data-movie-id'), btn.getAttribute('data-hash'));
                    });
                });
            }

            function startDownload(movieId, hash) {
                Dashboard.showLoadingMsg();
                ApiClient.ajax({
                    url: downloadsUrl(),
                    type: 'POST',
                    data: JSON.stringify({ MovieId: parseInt(movieId, 10), Hash: hash }),
                    contentType: 'application/json'
                }).then(function () {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Download started.');
                    refreshDownloads();
                }).catch(function (err) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Could not start download: ' + (err && err.statusText ? err.statusText : 'unknown error'));
                });
            }

            // qBittorrent's raw torrent states, mapped to short human-readable labels. Falls back to
            // the raw state string for anything not listed here (e.g. rarer states), so nothing is
            // ever hidden from the user, just not specially worded.
            var QB_STATE_LABELS = {
                downloading: 'Downloading',
                forcedDL: 'Downloading (forced)',
                metaDL: 'Fetching metadata',
                forcedMetaDL: 'Fetching metadata (forced)',
                stalledDL: 'Stalled (no peers)',
                queuedDL: 'Queued',
                pausedDL: 'Paused',
                stoppedDL: 'Paused',
                checkingDL: 'Checking files',
                checkingResumeData: 'Checking files',
                allocating: 'Allocating disk space',
                moving: 'Moving files',
                // Seeding states, reported for torrents that already finished downloading and are
                // still registered with qBittorrent (i.e. DeleteFromQbAfterImport is off).
                uploading: 'Uploading',
                forcedUP: 'Uploading (forced)',
                stalledUP: 'Stalled (seeding)',
                queuedUP: 'Queued (seeding)',
                pausedUP: 'Paused (seeding)',
                stoppedUP: 'Paused (seeding)',
                checkingUP: 'Checking files',
            };

            function progressBarHtml(fraction, speed, eta) {
                var pct = Math.round((fraction || 0) * 1000) / 10;
                var speedText = '';
                var etaText = '';

                if (speed) {
                    speedText = formatBytes(speed) + '/s';
                }

                if (eta && eta > 0) {
                    etaText = formatTime(eta);
                }

                return '<div class="yts-progress-container">' +
                    '<div class="yts-progress-bar">' +
                    '<div class="yts-progress-fill" style="width:' + pct + '%;"></div>' +
                    '</div>' +
                    '<div class="yts-progress-text">' + pct.toFixed(1) + '%' +
                    (speedText ? ' • ' + speedText : '') +
                    (etaText ? ' • ETA: ' + etaText : '') +
                    '</div>' +
                    '</div>';
            }

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                var k = 1024;
                var sizes = ['B', 'KB', 'MB', 'GB'];
                var i = Math.floor(Math.log(bytes) / Math.log(k));
                return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
            }

            function formatTime(seconds) {
                if (seconds < 60) return Math.round(seconds) + 's';
                if (seconds < 3600) return Math.round(seconds / 60) + 'm';
                var hours = seconds / 3600;
                var minutes = Math.round((hours % 1) * 60);
                return Math.floor(hours) + 'h ' + (minutes > 0 ? minutes + 'm' : '');
            }

            function renderDownloads(items) {
                var container = document.querySelector('#YtsDownloadsList');
                if (!items || items.length === 0) {
                    container.innerHTML = '<p>No downloads yet.</p>';
                    return;
                }

                var rows = items.map(function (item) {
                    var statusBadge;
                    var progressCell;

                    if (item.State === 'Downloading') {
                        var detailState = escapeHtml(QB_STATE_LABELS[item.QbState] || item.QbState || 'Downloading');
                        statusBadge = '<span style="display:inline-block;padding:4px 8px;border-radius:3px;font-size:0.85em;font-weight:500;white-space:nowrap;background-color:#004080;color:#00ffff;">↓ ' + detailState + '</span>';
                        progressCell = progressBarHtml(item.Progress, item.DownloadSpeed, item.EstimatedTimeRemaining);
                    } else if (item.State === 'Completed') {
                        // Downloaded and imported already -- QbState here reflects live seeding
                        // status (uploading, stalled, etc.), not download progress, so no progress bar.
                        var seedingState = escapeHtml(QB_STATE_LABELS[item.QbState] || item.QbState || 'Seeding');
                        statusBadge = '<span style="display:inline-block;padding:4px 8px;border-radius:3px;font-size:0.85em;font-weight:500;white-space:nowrap;background-color:#1a5c1a;color:#00ff00;">✓ ' + seedingState + '</span>';
                        progressCell = item.UploadedBytes ? '↑ ' + formatBytes(item.UploadedBytes) + ' seeded' : '&mdash;';
                    } else if (item.State === 'Failed') {
                        var errorMsg = item.LastError ? ' &mdash; ' + escapeHtml(item.LastError) : '';
                        statusBadge = '<span style="display:inline-block;padding:4px 8px;border-radius:3px;font-size:0.85em;font-weight:500;white-space:nowrap;background-color:#801010;color:#ff4444;">✗ Failed' + errorMsg + '</span>';
                        progressCell = '&mdash;';
                    } else {
                        statusBadge = '<span style="display:inline-block;padding:4px 8px;border-radius:3px;font-size:0.85em;font-weight:500;white-space:nowrap;background-color:#805010;color:#ffff00;">' + escapeHtml(item.State) + '</span>';
                        progressCell = '&mdash;';
                    }

                    return '<tr><td>' + escapeHtml(item.MovieTitle) + ' (' + escapeHtml(item.Year) + ')</td>' +
                        '<td>' + statusBadge + '</td>' +
                        '<td>' + progressCell + '</td></tr>';
                }).join('');

                container.innerHTML = '<table class="detailTable"><thead><tr><th>Movie</th><th>Status</th><th>Progress</th></tr></thead>' +
                    '<tbody>' + rows + '</tbody></table>';
            }

            var lastDownloadsJson = null;

            function refreshDownloads() {
                ApiClient.ajax({
                    url: downloadsUrl(),
                    type: 'GET',
                    dataType: 'json'
                }).then(function(items) {
                    var currentJson = JSON.stringify(items);
                    if (currentJson !== lastDownloadsJson) {
                        lastDownloadsJson = currentJson;
                        renderDownloads(items);
                    }
                });
            }

            function openSearchModal() {
                document.querySelector('#YtsSearchModalBackdrop').style.display = 'flex';
                document.querySelector('#YtsSearchQuery').focus();
            }

            function closeSearchModal() {
                document.querySelector('#YtsSearchModalBackdrop').style.display = 'none';
            }

            function onModalKeyDown(e) {
                if (e.key === 'Escape') {
                    closeSearchModal();
                }
            }

            document.querySelector('#OpenSearchModalButton').addEventListener('click', openSearchModal);
            document.querySelector('#CloseSearchModalButton').addEventListener('click', closeSearchModal);
            document.querySelector('#YtsSearchModalBackdrop').addEventListener('click', function (e) {
                if (e.target === e.currentTarget) {
                    closeSearchModal();
                }
            });

            document.querySelector('#YtsTorrentsBrowsePage').addEventListener('pageshow', function () {
                refreshDownloads();
                pollHandle = window.setInterval(refreshDownloads, 5000);
                // Bound to document (not this page's own DOM), so it must be added/removed in step
                // with pageshow/pagehide -- otherwise it would keep piling up across repeat visits
                // to this page, since the page's DOM being replaced doesn't detach a document-level
                // listener on its own.
                document.addEventListener('keydown', onModalKeyDown);
            });

            document.querySelector('#YtsTorrentsBrowsePage').addEventListener('pagehide', function () {
                if (pollHandle) {
                    window.clearInterval(pollHandle);
                    pollHandle = null;
                }
                document.removeEventListener('keydown', onModalKeyDown);
                closeSearchModal();
            });

            function performSearch() {
                var query = document.querySelector('#YtsSearchQuery').value;
                if (!query) {
                    return;
                }

                var resultsContainer = document.querySelector('#YtsSearchResults');
                var infoContainer = document.querySelector('#YtsSearchResultsInfo');

                infoContainer.innerHTML = '<div class="yts-results-info"><span class="yts-loading-spinner"></span>Searching...</div>';
                resultsContainer.innerHTML = '';

                ApiClient.ajax({
                    url: searchUrl(query),
                    type: 'GET',
                    dataType: 'json'
                }).then(function (movies) {
                    renderResults(movies);
                }).catch(function (err) {
                    infoContainer.innerHTML = '';
                    resultsContainer.innerHTML = '<p style="color: #ff6b6b;">Search failed: ' + escapeHtml(err && err.statusText ? err.statusText : 'unknown error') + '</p>';
                });
            }

            document.querySelector('#YtsTorrentsSearchForm').addEventListener('submit', function (e) {
                e.preventDefault();
                performSearch();
                return false;
            });

            document.querySelector('#YtsSearchQuery').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        })();
        </script>
    </div>
</body>
</html>
