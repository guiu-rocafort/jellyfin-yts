<!DOCTYPE html>
<html lang="en">
<head>
    <title>YTS Torrents</title>
</head>
<body>
    <div id="YtsTorrentsBrowsePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2>YTS Torrents</h2>
                    <button is="emby-button" type="button" id="OpenSearchModalButton" class="raised button-submit block emby-button">
                        <span>Search</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <h3>Downloads</h3>
                    <div id="YtsDownloadsList"></div>
                </div>
            </div>
        </div>

        <!-- Search modal: hidden until "Search" is clicked. A hand-rolled overlay rather than any
             Jellyfin dialog helper, since this page's own script execution and DOM lifecycle already
             turned out to have several undocumented quirks in 12.1 (see the comment below on
             pageshow/pagehide) -- a self-contained modal avoids depending on internal APIs that may
             not behave the same way across versions. -->
        <div id="YtsSearchModalBackdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; padding: 1em;">
            <div id="YtsSearchModalBox" style="background: #101010; border-radius: 6px; padding: 1.5em; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 4px 24px rgba(0,0,0,0.5);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em;">
                    <h2 style="margin: 0;">Search YTS</h2>
                    <button is="emby-button" type="button" id="CloseSearchModalButton" class="raised emby-button" style="min-width: auto;">
                        <span>Close</span>
                    </button>
                </div>
                <form id="YtsTorrentsSearchForm">
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="YtsSearchQuery" label="Search YTS" placeholder="Movie title..." />
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Search</span>
                    </button>
                </form>

                <div class="verticalSection">
                    <h3>Results</h3>
                    <div id="YtsSearchResults"></div>
                </div>
            </div>
        </div>
        <!-- This <script> MUST be a descendant of the div[data-role="page"] above, not a sibling after
             it: Jellyfin's viewContainer.js parseHtml() extracts only that div (via
             wrapper.querySelector('div[data-role="page"]')) when loading this page, so anything
             outside it -- including a sibling <script> -- is silently discarded and never runs. -->
        <script type="text/javascript">
        (function () {
            var pollHandle = null;

            function searchUrl(query) {
                return ApiClient.getUrl('Plugins/YtsTorrents/Search', { query: query });
            }

            function downloadsUrl() {
                return ApiClient.getUrl('Plugins/YtsTorrents/Downloads');
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function renderResults(movies) {
                var container = document.querySelector('#YtsSearchResults');
                if (!movies || movies.length === 0) {
                    container.innerHTML = '<p>No results.</p>';
                    return;
                }

                var html = movies.map(function (movie) {
                    var rows = (movie.Torrents || []).map(function (torrent) {
                        var actionCell = torrent.Downloaded
                            ? '<span style="color: #5cb85c;">Downloaded</span>'
                            : '<button is="emby-button" class="raised emby-button yts-download-btn" ' +
                              'data-movie-id="' + escapeHtml(movie.MovieId) + '" data-hash="' + escapeHtml(torrent.Hash) + '">' +
                              '<span>Download</span></button>';
                        return '<tr>' +
                            '<td>' + escapeHtml(torrent.Quality) + ' (' + escapeHtml(torrent.Type) + ')</td>' +
                            '<td>' + escapeHtml(torrent.Size) + '</td>' +
                            '<td>' + escapeHtml(torrent.Seeds) + ' / ' + escapeHtml(torrent.Peers) + '</td>' +
                            '<td>' + actionCell + '</td>' +
                            '</tr>';
                    }).join('');

                    return '<div class="yts-movie">' +
                        '<h4>' + escapeHtml(movie.Title) + ' (' + escapeHtml(movie.Year) + ') &ndash; ' + escapeHtml(movie.Rating) + '/10</h4>' +
                        '<table class="detailTable"><thead><tr><th>Quality</th><th>Size</th><th>Seeds/Peers</th><th></th></tr></thead>' +
                        '<tbody>' + rows + '</tbody></table>' +
                        '</div>';
                }).join('');

                container.innerHTML = html;

                container.querySelectorAll('.yts-download-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        startDownload(btn.getAttribute('data-movie-id'), btn.getAttribute('data-hash'));
                    });
                });
            }

            function startDownload(movieId, hash) {
                Dashboard.showLoadingMsg();
                ApiClient.ajax({
                    url: downloadsUrl(),
                    type: 'POST',
                    data: JSON.stringify({ MovieId: parseInt(movieId, 10), Hash: hash }),
                    contentType: 'application/json'
                }).then(function () {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Download started.');
                    refreshDownloads();
                }).catch(function (err) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Could not start download: ' + (err && err.statusText ? err.statusText : 'unknown error'));
                });
            }

            // qBittorrent's raw torrent states, mapped to short human-readable labels. Falls back to
            // the raw state string for anything not listed here (e.g. rarer states), so nothing is
            // ever hidden from the user, just not specially worded.
            var QB_STATE_LABELS = {
                downloading: 'Downloading',
                forcedDL: 'Downloading (forced)',
                metaDL: 'Fetching metadata',
                forcedMetaDL: 'Fetching metadata (forced)',
                stalledDL: 'Stalled (no peers)',
                queuedDL: 'Queued',
                pausedDL: 'Paused',
                stoppedDL: 'Paused',
                checkingDL: 'Checking files',
                checkingResumeData: 'Checking files',
                allocating: 'Allocating disk space',
                moving: 'Moving files',
                // Seeding states, reported for torrents that already finished downloading and are
                // still registered with qBittorrent (i.e. DeleteFromQbAfterImport is off).
                uploading: 'Uploading',
                forcedUP: 'Uploading (forced)',
                stalledUP: 'Stalled (seeding)',
                queuedUP: 'Queued (seeding)',
                pausedUP: 'Paused (seeding)',
                stoppedUP: 'Paused (seeding)',
                checkingUP: 'Checking files',
            };

            function progressBarHtml(fraction) {
                var pct = Math.round((fraction || 0) * 1000) / 10;
                return '<div style="background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;height:6px;min-width:90px;">' +
                    '<div style="background:#00a4dc;height:100%;width:' + pct + '%;"></div>' +
                    '</div>' +
                    '<div style="font-size:0.85em;margin-top:2px;">' + pct.toFixed(1) + '%</div>';
            }

            function renderDownloads(items) {
                var container = document.querySelector('#YtsDownloadsList');
                if (!items || items.length === 0) {
                    container.innerHTML = '<p>No downloads yet.</p>';
                    return;
                }

                var rows = items.map(function (item) {
                    var statusText;
                    var progressCell;

                    if (item.State === 'Downloading') {
                        statusText = escapeHtml(QB_STATE_LABELS[item.QbState] || item.QbState || 'Downloading');
                        progressCell = progressBarHtml(item.Progress);
                    } else if (item.State === 'Completed') {
                        // Downloaded and imported already -- QbState here reflects live seeding
                        // status (uploading, stalled, etc.), not download progress, so no progress bar.
                        statusText = escapeHtml(QB_STATE_LABELS[item.QbState] || item.QbState || 'Seeding');
                        progressCell = '&mdash;';
                    } else if (item.State === 'Failed') {
                        statusText = 'Failed' + (item.LastError ? ' &mdash; ' + escapeHtml(item.LastError) : '');
                        progressCell = '&mdash;';
                    } else {
                        statusText = escapeHtml(item.State);
                        progressCell = '&mdash;';
                    }

                    return '<tr><td>' + escapeHtml(item.MovieTitle) + ' (' + escapeHtml(item.Year) + ')</td>' +
                        '<td>' + statusText + '</td>' +
                        '<td>' + progressCell + '</td></tr>';
                }).join('');

                container.innerHTML = '<table class="detailTable"><thead><tr><th>Movie</th><th>Status</th><th>Progress</th></tr></thead>' +
                    '<tbody>' + rows + '</tbody></table>';
            }

            function refreshDownloads() {
                ApiClient.ajax({
                    url: downloadsUrl(),
                    type: 'GET',
                    dataType: 'json'
                }).then(renderDownloads);
            }

            function openSearchModal() {
                document.querySelector('#YtsSearchModalBackdrop').style.display = 'flex';
                document.querySelector('#YtsSearchQuery').focus();
            }

            function closeSearchModal() {
                document.querySelector('#YtsSearchModalBackdrop').style.display = 'none';
            }

            function onModalKeyDown(e) {
                if (e.key === 'Escape') {
                    closeSearchModal();
                }
            }

            document.querySelector('#OpenSearchModalButton').addEventListener('click', openSearchModal);
            document.querySelector('#CloseSearchModalButton').addEventListener('click', closeSearchModal);
            document.querySelector('#YtsSearchModalBackdrop').addEventListener('click', function (e) {
                if (e.target === e.currentTarget) {
                    closeSearchModal();
                }
            });

            document.querySelector('#YtsTorrentsBrowsePage').addEventListener('pageshow', function () {
                refreshDownloads();
                pollHandle = window.setInterval(refreshDownloads, 5000);
                // Bound to document (not this page's own DOM), so it must be added/removed in step
                // with pageshow/pagehide -- otherwise it would keep piling up across repeat visits
                // to this page, since the page's DOM being replaced doesn't detach a document-level
                // listener on its own.
                document.addEventListener('keydown', onModalKeyDown);
            });

            document.querySelector('#YtsTorrentsBrowsePage').addEventListener('pagehide', function () {
                if (pollHandle) {
                    window.clearInterval(pollHandle);
                    pollHandle = null;
                }
                document.removeEventListener('keydown', onModalKeyDown);
                closeSearchModal();
            });

            document.querySelector('#YtsTorrentsSearchForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var query = document.querySelector('#YtsSearchQuery').value;
                if (!query) {
                    return false;
                }

                Dashboard.showLoadingMsg();
                ApiClient.ajax({
                    url: searchUrl(query),
                    type: 'GET',
                    dataType: 'json'
                }).then(function (movies) {
                    Dashboard.hideLoadingMsg();
                    renderResults(movies);
                }).catch(function (err) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Search failed: ' + (err && err.statusText ? err.statusText : 'unknown error'));
                });

                return false;
            });
        })();
        </script>
    </div>
</body>
</html>
